# PCS WireGuard management-tunnel example
#
# Copy this file to /etc/pcs/wireguard-management.conf on PCS only when the
# feature is ready to configure. The runtime file is deployment-local and must
# not be committed. WireGuard private keys never belong in this file.

# The PCS tunnel address must be one IPv4 /32 from a dedicated management
# range. It must not overlap the PCS field LAN (10.42.0.0/24).
PCS_WG_ADDRESS="10.77.0.20/32"

# Public key and Internet endpoint of the trusted home WireGuard hub.
PCS_WG_HUB_PUBLIC_KEY="CHANGE_ME"
PCS_WG_ENDPOINT="vpn.example.net:51820"

# Split-tunnel destinations reachable through the home hub. PCS deliberately
# accepts only explicit /32 management peers here--never a default route or a
# home-LAN prefix. With the recommended home-hub SNAT design this is just the
# hub's WireGuard address.
PCS_WG_ALLOWED_IPS="10.77.0.1/32"

# Source addresses authorized to manage PCS and route into the PCS field LAN.
# Every value must also appear in PCS_WG_ALLOWED_IPS.
PCS_WG_ADMIN_SOURCES="10.77.0.1/32"

# Persistent keepalive keeps an outbound tunnel usable through NAT and mobile
# carrier CGNAT without causing PCS to bring up cellular itself.
PCS_WG_PERSISTENT_KEEPALIVE="25"

# Fixed PCS-side interfaces and LAN. These defaults match the commissioned
# topology and are validated before configuration or activation.
PCS_WG_INTERFACE="wg-pcs"
PCS_WG_LAN_INTERFACE="eth0"
PCS_WG_LAN_NETWORK="10.42.0.0/24"

# A conservative MTU prevents TLS and SSH stalls when PCS reaches the home hub
# through cellular carrier tunnels with less headroom than ordinary Ethernet.
PCS_WG_MTU="1280"

# Optional deployment-local home-Wi-Fi trust. Configure both values to permit
# the protected management ports directly from one private home subnet when
# PCS is associated with that same WLAN. Leave both empty to remain fail-closed.
# This never grants management access from cellular or arbitrary WAN ingress.
PCS_WG_HOME_INTERFACE=""
PCS_WG_HOME_NETWORK=""

# Administrative TCP listeners protected from non-LAN/non-WireGuard ingress.
# This covers SSH, HTTP/HTTPS, the legacy admin redirect, and Cockpit.
PCS_WG_PROTECTED_TCP_PORTS="22,80,139,443,445,8080,9090"

# Generated separately by setup-wireguard-management.sh --generate-key.
PCS_WG_PRIVATE_KEY_FILE="/etc/pcs/wireguard/private.key"

# ASUS and other hubs may add a WireGuard pre-shared key. The importer stores
# it separately from both this non-secret policy file and the PCS private key.
PCS_WG_USE_PRESHARED_KEY="no"
PCS_WG_PRESHARED_KEY_FILE="/etc/pcs/wireguard/preshared.key"
