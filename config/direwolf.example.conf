# PCS Dire Wolf configuration example
#
# SAFE DEFAULT: receive-only, no network TNC listeners, no APRS-IS, no PTT,
# no beaconing, and no digipeating. The staging installer copies this example
# under /etc/pcs/aprs/ but does not activate it as /etc/direwolf.conf.
#
# Selected PCS desired profile (not yet activated):
#   W8IJC-2, GPS-backed two-way digi-IGate on 144.555 MHz, KISS client access,
#   EasyDigi GPIO PTT, fill-in digipeating, FX.25 TX, and packet logging.
# PCS_AUDIO remains a placeholder. Do not enable Dire Wolf until the stable
# ALSA identifier and the activation blockers in docs/direwolf-aprs.md are
# resolved on the actual PCS hardware.

#############################################################
# AUDIO DEVICE AND MODEM
#############################################################

# Syntax: ADEVICE <capture-device> [playback-device]
# "null" discards transmit audio and makes this example receive-only even if
# the attached radio supports VOX. Prefer a stable ALSA card ID rather than a
# boot-order-dependent card number.
ADEVICE plughw:CARD=PCS_AUDIO,DEV=0 null

# Common sample rates are 44100 or 48000. Start with 48000 unless the actual
# sound card or modem profile requires something else.
ARATE 48000

# 1 = mono, 2 = stereo/two radio channels.
ACHANNELS 1

CHANNEL 0

# Licensed station callsign with optional APRS SSID, uppercase.
MYCALL W8IJC-2

# 1200 AFSK is the common VHF APRS modem. 300 is commonly used for HF packet.
# 9600 requires a radio interface with suitable discriminator/data audio.
MODEM 1200

#############################################################
# CHANNEL ACCESS / TRANSMIT TIMING
#############################################################

# These values matter only if an operator later enables transmit. Units for
# SLOTTIME, TXDELAY, and TXTAIL are 10 ms. They require bench and on-air
# validation with the actual radio; the commented values are starting points,
# not measured PCS settings.
#DWAIT 0
#SLOTTIME 10
#PERSIST 63
#TXDELAY 30
#TXTAIL 10
#FULLDUP OFF

#############################################################
# PUSH TO TALK (CHOOSE AT MOST ONE AFTER HARDWARE DETECTION)
#############################################################

# CM108/CM119-family HID GPIO. The simple form lets Dire Wolf locate the
# matching interface; an explicit GPIO bit and hidraw device may also be used.
#PTT CM108
#PTT CM108 3 /dev/hidraw0

# Serial RTS/DTR, Raspberry Pi GPIO, or Hamlib radio control are alternatives.
# PCS selects active-high Pi GPIO into the EasyDigi optocoupler. Its isolated
# transistor output closes the radio's active-low PTT input to radio ground.
# GPIO17 (physical header pin 11) is selected. A plain positive number is
# active high. Prefixing the GPIO number with "-" would invert it and is not
# selected here.
#PTT /dev/ttyUSB0 RTS
#PTT /dev/ttyUSB0 DTR
#PTT GPIO 17
#PTT RIG <hamlib-model> <radio-device>

#############################################################
# NETWORK TNC INTERFACES
#############################################################

# 0 disables the listener. Conventional enabled ports are AGW 8000/tcp and
# KISS 8001/tcp. Dire Wolf listens beyond the PCS client LAN by default, so
# leave these disabled until interface-scoped firewall rules are validated.
AGWPORT 0
KISSPORT 0

#############################################################
# APRS-IS IGATE (OPTIONAL)
#############################################################

# Add these only for an operator-approved IGate. Store the passcode only in
# the root-owned live /etc/direwolf.conf; never in Git or pcs-install.conf.
#IGSERVER noam.aprs2.net
#IGLOGIN W8IJC-2 <APRS-IS-passcode>

# Selected RF-to-IS policy: gate all packets that pass Dire Wolf's normal
# IGate eligibility/safety rules. This is represented by omitting FILTER 0 IG;
# a FILTER 0 IG directive would narrow which received RF packets are uploaded.

# Selected Internet-to-RF policy: normal two-way message gating, direct on
# channel 0, without a digipeater path. Dire Wolf applies its IGate eligibility
# logic and transmit rate limits; this does not retransmit the full server feed.
#IGTXVIA 0
#IGTXLIMIT 6 10

# Optional server-side filter. Choose it for the actual operating objective.
#IGFILTER m/50

# IGTXVIA remains commented in this safe staging template because it enables
# transmit. The intended hardware-activated profile will use the direct form.

#############################################################
# GPS / TRACKER BEACONING (OPTIONAL, TRANSMIT-CAPABLE PROFILE)
#############################################################

# PCS path: EM7565 NMEA on /dev/ttyUSB1 -> private local gpsd listener ->
# Dire Wolf. The separate 10.42.0.1:2947 proxy is only for trusted LAN clients.
# GPSD access is read-only and safe in the staged template.
GPSD localhost 2947

# Selected interval is 10 minutes. Symbol, RF path, and final comment remain
# operator choices. The live generator will omit VIA when the path is direct.
#TBEACON delay=0:30 every=10:00 symbol="igate" comment="PCS"

# A fixed-position beacon can use PBEACON instead. Do not commit a private
# deployment location unless that disclosure is intentional.
#PBEACON delay=0:30 every=20:00 lat=<latitude> long=<longitude> symbol="igate" comment="PCS"

#############################################################
# DIGIPEATER (OPTIONAL, TRANSMIT-CAPABLE PROFILE)
#############################################################

# Selected short-range fill-in policy. It repeats WIDE1-1 once on the same
# channel, also recognizes MYCALL (W8IJC-2), performs no preemptive path
# handling, and does not provide WIDE2-N service.
#DIGIPEAT 0 0 ^W8IJC-2$ ^WIDE1-1$ OFF
#DEDUPE 30

# Use FILTER rules only when the operating plan needs narrower RF/APRS-IS routing.
#FILTER 0 0 <radio-to-radio-filter>
#FILTER 0 IG <radio-to-APRS-IS-filter>
#FILTER IG 0 <APRS-IS-to-radio-filter>

#############################################################
# OPTIONAL FEC / LOGGING
#############################################################

# Dire Wolf receives normal AX.25 and supported FEC formats automatically.
# Enabling FEC for transmit changes interoperability/airtime; leave disabled
# unless it is part of the operator-approved plan.
#FX25TX 1
#IL2PTX 1

# LOGDIR must be writable by the unprivileged direwolf service account.
#LOGDIR /var/log/direwolf
