# Static PCS portal; existing Python application paths remain explicit.
# No URI suffix on proxy_pass: /admin/... and query strings reach Python intact.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    autoindex off;
    root /var/www/pcs;
    index index.html;
    types { text/html html; text/css css; application/javascript js; image/svg+xml svg; image/png png; image/webp webp; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    client_max_body_size 64k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;

    proxy_set_header Host $http_host;
    # Overwrite untrusted client headers; this is the only public proxy hop.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 90s;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_redirect off;

    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/(files|docs|radio|pistar|starlink)/$ {
        expires -1;
        try_files $uri/index.html =404;
    }
    location ~ ^/(files|docs|radio|pistar|starlink|status|cockpit|openwrt)$ {
        return 308 $uri/;
    }
    location = /cockpit/ {
        return 302 https://$host:9090/;
    }
    location = /openwrt/ {
        return 302 http://10.42.0.2/;
    }
    location = /status/ {
        # Keep the existing Python document's own nonce/style policy.
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /health {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /api/public-status {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /admin {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8081;
    }
    location ^~ /admin/ {
        add_header X-Content-Type-Options nosniff always;
        # 300s action + 75s dashboard + 10s backup settings, with margin.
        proxy_read_timeout 420s;
        proxy_pass http://127.0.0.1:8081;
    }
    location / {
        return 404;
    }
}
