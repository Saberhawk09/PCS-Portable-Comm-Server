[agent]
# The agent accepts only APRS messages whose fixed-width addressee is this
# exact station identity. It does not establish an APRS-IS connection.
callsign = W8IJC-10

# APZ is the APRS experimental/software destination range. The agent remains
# separately identifiable from Dire Wolf while it is under PCS development.
tocall = APZPCS

# The KISS endpoint is deliberately loopback-only. Channel 8 must match the
# unused Dire Wolf ICHANNEL value in /etc/direwolf.conf. Channel 0 is RF and is
# rejected by the agent.
kiss_host = 127.0.0.1
kiss_port = 8001
kiss_channel = 8

# systemd creates this private state directory. SQLite stores message identity
# hashes and the outbound message counter, never command bodies or coordinates.
state_db = /var/lib/pcs-aprs-agent/state.sqlite3
dedupe_ttl_seconds = 86400

# GPS status reports only NO FIX, 2D, 3D, or UNAVAILABLE. Coordinates are never
# included in APRS replies or stored in the agent database.
gpsd_host = 127.0.0.1
gpsd_port = 2947
command_timeout_seconds = 3

# Bounded command/reply rates limit abuse. Required protocol ACKs are still sent.
sender_rate_per_minute = 12
global_rate_per_minute = 60
reconnect_max_seconds = 60
