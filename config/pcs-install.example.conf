# PCS install answer/config example
#
# Copy to config/pcs-install.conf or let scripts/setup-pcs-base.sh create it.
# This file is intentionally simple shell syntax so setup scripts can source it.

PCS_CELLULAR_PROFILE="pcs-cellular-profile"
PCS_CELLULAR_APN="fast.t-mobile.com"
PCS_CELLULAR_ROUTE_METRIC="900"

PCS_SAMBA_USER="pi"
PCS_SAMBA_WORKGROUP="WORKGROUP"
# PCS_SAMBA_PASSWORD may be exported before running setup, but setup-pcs-base.sh
# intentionally does not write it to config/pcs-install.conf.

# Optional base installer choices:
# ask / yes / no
PCS_SETUP_USB_PRIMARY="yes"
# auto, /dev/sdX1, or a filesystem UUID
PCS_SETUP_USB_DEVICE="auto"
PCS_SETUP_WWAN_GPS="no"
# Publish GPSD only on the trusted PCS LAN at 10.42.0.1:2947.
PCS_SETUP_GPSD_LAN="no"
# Include Pi-Star health checks and local-access links.
PCS_SETUP_PISTAR="no"
# Optional Dire Wolf / APRS state: no, staged, or yes.
# "staged" means software is installed but the service and RF path are disabled.
PCS_SETUP_APRS="staged"
# Optional Meshtastic Bluetooth state: no, staged, or yes.
# "staged" installs the client/gateway but does not pair or connect to a node.
# "yes" means a persistent BLE target and MQTT broker are configured.
PCS_SETUP_MESHTASTIC="no"
# Install and start the GPIO-only 16x2 HD44780 LCD status display when fitted.
PCS_SETUP_GPIO_LCD="no"
# Install and start the six-pixel GPIO21 WS2812 status indicators when fitted.
PCS_SETUP_GPIO_LEDS="no"
# Install and start the SPI-only MAX7219 statistics display when fitted.
PCS_SETUP_GPIO_STATS="no"
# Install GPIO18 hardware PWM thermal fan control when the Armor Lite is fitted.
PCS_SETUP_GPIO_FAN="no"
# staged, rx, or tx; written by the guarded activation workflow.
PCS_APRS_ACTIVE_MODE="staged"

# Dire Wolf / APRS profile inputs. These are non-secret desired settings for
# the managed config generator; staging does not activate them. The commissioned
# PCS station identity is intentionally versioned here, but credentials are not.
PCS_APRS_CONFIG_VERSION="1"
# Commissioned PCS role: GPS-backed fill-in digi + two-way IGate.
PCS_APRS_ROLE="digi-igate"
PCS_APRS_CALLSIGN="W8IJC-10"
# Operator-facing metadata; the managed SA818S service applies the radio block
# below at boot and verifies the frequency readback before Dire Wolf starts.
PCS_APRS_FREQUENCY="144.550 MHz"
PCS_APRS_RADIO="SA818S / EasyDigi / Sabrent USB audio"
PCS_APRS_AUDIO_INPUT="plughw:CARD=Device,DEV=0"
PCS_APRS_AUDIO_OUTPUT="plughw:CARD=Device,DEV=0"
PCS_APRS_AUDIO_CARD="Device"
PCS_APRS_PLAYBACK_CONTROL="Speaker"
PCS_APRS_PLAYBACK_LEVEL="-18dB"
PCS_APRS_CAPTURE_CONTROL="Mic"
PCS_APRS_CAPTURE_LEVEL="100%"
PCS_APRS_AGC_CONTROL="Auto Gain Control"
PCS_APRS_AGC_STATE="off"
PCS_APRS_SAMPLE_RATE="48000"
PCS_APRS_AUDIO_CHANNELS="1"
PCS_APRS_MODEM="1200"
# none, cm108, serial-rts, serial-dtr, gpio, hamlib, or vox
PCS_APRS_PTT_METHOD="gpio"
PCS_APRS_PTT_INTERFACE="EasyDigi"
PCS_APRS_PTT_GPIO_LINE="6"
# Pi-side GPIO is active high. The EasyDigi optocoupler converts this to the
# radio-side active-low closure to ground used to key transmit.
PCS_APRS_PTT_ACTIVE_LEVEL="high"
# Both client ports are restricted to the PCS LAN by nftables.
PCS_APRS_AGW_PORT="8000"
PCS_APRS_KISS_PORT="8001"
PCS_APRS_KISS_LAN_INTERFACE="eth0"
PCS_APRS_KISS_LAN_NETWORK="10.42.0.0/24"
PCS_APRS_IGATE="yes"
PCS_APRS_IGATE_SERVER="noam.aprs2.net"
# Conventional two-way IGate: RF -> APRS-IS plus eligible APRS messages from
# APRS-IS -> RF. This does not rebroadcast the full APRS-IS feed.
PCS_APRS_IGATE_MODE="two-way"
# APRS-IS passcodes are intentionally never stored here. "all-eligible" means
# no FILTER 0 IG restriction; Dire Wolf's normal IGate eligibility rules apply.
PCS_APRS_IGATE_RF_TO_IS_FILTER="all-eligible"
# "normal-messages" uses Dire Wolf's normal message-gating logic. "direct"
# generates IGTXVIA 0, with no digipeater path.
PCS_APRS_IGATE_IS_TO_RF_FILTER="normal-messages"
PCS_APRS_IGATE_TX_PATH="direct"
PCS_APRS_IGATE_TX_LIMIT_1M="6"
PCS_APRS_IGATE_TX_LIMIT_5M="10"
PCS_APRS_GPSD="yes"
# Dire Wolf runs on the PCS Pi and consumes the private local gpsd listener.
# The 10.42.0.1:2947 proxy is for other trusted LAN clients, not Dire Wolf.
PCS_APRS_GPSD_HOST="localhost"
PCS_APRS_GPSD_PORT="2947"
PCS_APRS_BEACON="yes"
PCS_APRS_BEACON_TYPE="gps-tracker"
PCS_APRS_BEACON_INTERVAL="10:00"
PCS_APRS_BEACON_PATH="direct"
PCS_APRS_BEACON_SENDTO="IG"
PCS_APRS_BEACON_SYMBOL="igate"
PCS_APRS_BEACON_OVERLAY="T"
PCS_APRS_BEACON_ALTITUDE="yes"
PCS_APRS_BEACON_COMMENT="PCS Portable Communication Server - W8IJC"
PCS_APRS_DIGIPEAT="yes"
PCS_APRS_DIGIPEAT_MODE="fill-in"
PCS_APRS_DIGIPEAT_ALIAS="WIDE1-1"
PCS_APRS_DIGIPEAT_ALIAS_PATTERN="^WIDE1-1$"
PCS_APRS_DIGIPEAT_WIDE_PATTERN="^WIDE1-1$"
PCS_APRS_DIGIPEAT_PREEMPTIVE="OFF"
PCS_APRS_DIGIPEAT_FILTER="all-eligible"
PCS_APRS_DIGIPEAT_DEDUPE_SECONDS="30"
PCS_APRS_TX_ENABLED="yes"
PCS_APRS_FX25_TX="no"
PCS_APRS_LOGGING="yes"
PCS_APRS_LOG_RETENTION_DAYS="14"
# Commissioned channel-access values. The SA818S needs 900 ms after PTT before
# packet audio; 700 ms and below were unusable and 800 ms was marginal.
PCS_APRS_DWAIT="0"
PCS_APRS_SLOTTIME="10"
PCS_APRS_PERSIST="63"
PCS_APRS_TXDELAY="90"
PCS_APRS_TXTAIL="20"
PCS_APRS_FULLDUP="OFF"
# Hardware evidence is deliberately not versioned as reusable state. Record it
# again after verifying the installed hardware, even when restoring this PCS.
PCS_APRS_RX_AUDIO_VALIDATED="no"
PCS_APRS_RADIO_CHANNEL_VALIDATED="no"
PCS_APRS_PTT_VALIDATED="no"
PCS_APRS_TX_AUDIO_VALIDATED="no"
PCS_APRS_TX_TIMING_VALIDATED="no"

# Boot-time SA818S programming over the Pi UART. Dire Wolf alone owns PTT.
PCS_APRS_RADIO_INIT="yes"
PCS_APRS_RADIO_DEVICE="/dev/serial0"
PCS_APRS_RADIO_BAUD="9600"
PCS_APRS_RADIO_BANDWIDTH_KHZ="25"
PCS_APRS_RADIO_TX_FREQUENCY_MHZ="144.5500"
PCS_APRS_RADIO_RX_FREQUENCY_MHZ="144.5500"
PCS_APRS_RADIO_TX_TONE="0000"
PCS_APRS_RADIO_RX_TONE="0000"
PCS_APRS_RADIO_SQUELCH="1"
PCS_APRS_RADIO_VOLUME="8"
PCS_APRS_RADIO_PRE_DE_EMPHASIS="off"
PCS_APRS_RADIO_HIGH_PASS="off"
PCS_APRS_RADIO_LOW_PASS="off"
PCS_APRS_RADIO_TX_TAIL="off"
