# PCS Stats API runtime policy example
#
# Copy/import this only when the API deployment gate is ready. The live file is
# stored at /etc/pcs-stats-api/policy.conf and is not a credential.

PCS_API_PORT="9443"

# Comma-separated interface=IPv4-network entries. The PCS LAN must remain
# exactly 10.42.0.0/24. WireGuard entries must be explicit approved /32s.
# A deployment-local trusted home subnet may be added on wlan0, for example:
#   wlan0=192.168.50.0/24
PCS_API_ALLOWED_INTERFACE_SOURCES="eth0=10.42.0.0/24,wg-pcs=10.77.0.1/32"

PCS_API_CERT_FILE="/etc/pcs-stats-api/tls/server.crt"
PCS_API_KEY_FILE="/etc/pcs-stats-api/tls/server.key"
PCS_API_TOKEN_FILE="/etc/pcs-stats-api/api-read-tokens.json"

# Every comma-separated identity must appear in the server certificate SAN.
# Add the commissioned WireGuard address and any stable trusted-home name or IP
# before importing TLS material.
PCS_API_CERTIFICATE_IDENTITIES="IP:10.42.0.1,DNS:pcs.local"

# The fixed installed dispatcher and API application paths are validated.
PCS_API_DISPATCHER="/usr/local/sbin/pcs-web-action"
PCS_API_APPLICATION="/usr/local/lib/pcs-stats-api/pcs_stats_api.py"
