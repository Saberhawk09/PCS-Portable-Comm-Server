name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests web

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Check executable shell scripts and installed Python helpers
        run: |
          for script in scripts/*.sh; do
            test -x "$script"
          done
          test -x scripts/pcs-admin-password-helper.py
          test -x scripts/pcs-wwan-gps-nmea-start.py
          test -x scripts/pcs_aprs_telemetry.py
          test -x scripts/pcs_gpio.py
          test -x scripts/pcs_sa818.py
