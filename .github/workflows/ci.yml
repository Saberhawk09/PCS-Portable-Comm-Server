name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-witness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
      - name: Test shared witness receipts
        run: python -m unittest discover -s tests -p test_pcs_qualify_lan.py -v
      - name: Test Windows route safety and native TCP/UDP witness transport
        run: python -m unittest discover -s tests -p test_pcs_qualify_windows.py -v
      - name: Compile witness sources
        run: python -m py_compile scripts/pcs_qualify_lan.py scripts/pcs_qualify_windows.py
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install nginx for real frontend integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Test defensive portal JavaScript (no appliance Node dependency)
        run: node --test tests/test_pcs_home.js

      - name: Compile Python sources
        run: python -m compileall -q scripts tests web

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Check executable shell scripts and installed Python helpers
        run: |
          for script in scripts/*.sh; do
            test -x "$script"
          done
          test -x scripts/pcs-admin-password-helper.py
          test -x scripts/pcs-wwan-gps-nmea-start.py
          test -x scripts/pcs_aprs_telemetry.py
          test -x scripts/pcs_cellular_fallback.py
          test -x scripts/pcs_gpio.py
          test -x scripts/pcs_sa818.py
