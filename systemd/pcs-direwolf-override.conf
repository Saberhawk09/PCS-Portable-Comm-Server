[Unit]
Conflicts=graywolf.service pcs-aprs-ptt-safe.service
After=network-online.target gpsd.service pcs-sa818.service pcs-aprs-audio.service pcs-aprs-kiss-firewall.service
Wants=network-online.target pcs-sa818.service pcs-aprs-audio.service
Requires=pcs-aprs-kiss-firewall.service
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStartPre=/usr/local/sbin/pcs-sa818 --config /etc/pcs/aprs/sa818.ini --apply
ExecStartPre=/usr/local/sbin/pcs-aprs-audio --apply --wait-seconds 60
ExecStart=@DIREWOLF_BIN@ -c /etc/direwolf.conf
Restart=always
RestartSec=5s
ExecStopPost=+/usr/bin/systemctl --no-block start pcs-aprs-ptt-safe.service
